# Status board data: one entry per project.
# The order here is the order on the board.
#
#   code     short "flight number" (any letters/digits; ~4 characters looks best)
#   project  name shown on the board (keep it short: about 17 characters max)
#   theme    one- or two-word theme
#   status   one of: Scheduled, Boarding, In flight, Delayed, Landed
#            (anything else still shows, just in white)
#   eta      estimated arrival, written however you like, e.g. "Jun 2027"
#
# Text is shown in capitals on the board, so the case you use here doesn't matter.
# NB: the eta values below are PLACEHOLDERS.

